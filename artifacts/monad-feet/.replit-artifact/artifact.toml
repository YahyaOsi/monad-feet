kind = "web"
previewPath = "/"
title = "Monad Feet"
version = "1.0.0"
id = "artifacts/monad-feet"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22664

[services.development]
run = "pnpm --filter @workspace/monad-feet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/monad-feet", "run", "build" ]
publicDir = "artifacts/monad-feet/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22664"
BASE_PATH = "/"
