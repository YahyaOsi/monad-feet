openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Monad Feet API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and registration
  - name: users
    description: User profiles
  - name: invites
    description: Invite code management
  - name: posts
    description: Public feed posts
  - name: private-feed
    description: Private creator content
  - name: subscriptions
    description: Creator subscriptions
  - name: streak
    description: Daily streak and points
  - name: badges
    description: Loyalty badges
  - name: wallet
    description: Wallet operations
  - name: feed
    description: Feed summaries
paths:
  /game:
    get:
      operationId: getGame
      tags:
        - streak
      responses:
        "200":
          description: Live Monad game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeetGameState"
  /game/claims:
    get:
      operationId: listGameClaims
      tags:
        - streak
      responses:
        "200":
          description: Latest twenty verified awards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeetGameHistory"
    post:
      operationId: claimGame
      tags:
        - streak
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeetGameClaimInput"
      responses:
        "200":
          description: Receipt verified and rewards saved atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeetGameAward"
  /auth/session:
    get:
      operationId: getAuthSession
      tags:
        - auth
      summary: Return the wallet authenticated by the HTTP-only session cookie
      responses:
        "200":
          description: Session state (null if unauthenticated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  walletAddress:
                    type:
                      - string
                      - "null"
                required:
                  - walletAddress
  /auth/challenge:
    post:
      operationId: createAuthChallenge
      tags:
        - auth
      summary: Request a five-minute one-time wallet sign-in message for Monad chain 143
      description: Requires a same-origin Origin header. The message is bound to the
        requested wallet, origin, nonce, and chain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                walletAddress:
                  type: string
              required:
                - walletAddress
      responses:
        "200":
          description: Message to sign with the requested wallet
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
  /auth/verify:
    post:
      operationId: verifyAuthChallenge
      tags:
        - auth
      summary: Verify a wallet signature and create an HTTP-only cookie session
      description: Consumes the challenge exactly once; requires a same-origin Origin
        header. Supports EOAs and ERC-1271 wallets on Monad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                walletAddress:
                  type: string
                message:
                  type: string
                signature:
                  type: string
              required:
                - walletAddress
                - message
                - signature
      responses:
        "200":
          description: Wallet session established
          content:
            application/json:
              schema:
                type: object
                properties:
                  walletAddress:
                    type: string
                required:
                  - walletAddress
        "401":
          description: Signature invalid, expired, or challenge already used
  /auth/logout:
    post:
      operationId: logoutAuth
      tags:
        - auth
      summary: Revoke the current cookie session
      responses:
        "204":
          description: Session revoked
  /healthz:
    get:
      operationId: healthCheck
      tags:
        - health
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/registration/prepare:
    post:
      operationId: prepareRegistration
      tags:
        - auth
      summary: Validate app admission and recover an existing on-chain registration
      description: Requires a signed wallet session. Normalizes username by trimming
        and lowercasing; accepts 3–32 ASCII letters, digits or underscores. New
        accounts require an unused app invite. Returns registered false only
        after a successful chain read. For registered wallets returns the
        original verified transaction hash, independent of the selected app
        handle. Already verified app accounts return their existing evidence
        without consuming another invite. This preflight does not reserve a
        username or invite; register rechecks atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareRegistrationBody"
      responses:
        "200":
          description: Admission checked and chain status resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepareRegistrationResponse"
        default:
          description: Preparation failed; never interpret an error as unregistered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationError"
  /auth/register:
    post:
      operationId: registerUser
      tags:
        - auth
      summary: Register a new user
      description: Requires a signed wallet session matching walletAddress. Register
        using an unused invite code; NFT access is disabled until a verified
        contract is configured. Invite registrations receive no starter codes. A
        successful unique referral awards the inviter 1 point for the first
        referral, increasing by 1 up to 5 points per referral.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserBody"
      responses:
        "200":
          description: Already registered verified account (idempotent retry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request or invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/me:
    get:
      operationId: getMe
      tags:
        - users
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateMe
      tags:
        - users
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{userId}:
    get:
      operationId: getUser
      tags:
        - users
      summary: Get user profile by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithStats"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /invites:
    get:
      operationId: getMyInvites
      tags:
        - invites
      summary: Get current user's invite codes
      responses:
        "200":
          description: List of invite codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InviteCode"
  /invites/validate:
    post:
      operationId: validateInviteCode
      tags:
        - invites
      summary: Validate an invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateInviteBody"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateInviteResponse"
  /trending:
    get:
      operationId: getTrending
      tags:
        - posts
      summary: Get trending posts ranked by like velocity
      responses:
        "200":
          description: Trending posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingResponse"
  /posts:
    get:
      operationId: listPosts
      tags:
        - posts
      summary: List public feed posts
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type:
              - integer
              - "null"
        - name: limit
          in: query
          required: false
          schema:
            type:
              - integer
              - "null"
        - name: authorId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsPage"
    post:
      operationId: createPost
      tags:
        - posts
      summary: Create a new public post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostBody"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
  /posts/{postId}:
    get:
      operationId: getPost
      tags:
        - posts
      summary: Get a single post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePost
      tags:
        - posts
      summary: Delete a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /posts/{postId}/like:
    post:
      operationId: likePost
      tags:
        - posts
      summary: Like a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Like result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
    delete:
      operationId: unlikePost
      tags:
        - posts
      summary: Unlike a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unlike result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
  /private-posts:
    get:
      operationId: listPrivatePosts
      tags:
        - private-feed
      summary: List private posts for subscribed creator
      parameters:
        - name: creatorId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of private posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrivatePost"
        "403":
          description: Not subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createPrivatePost
      tags:
        - private-feed
      summary: Create a private post (creator only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrivatePostBody"
      responses:
        "201":
          description: Created private post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivatePost"
  /subscriptions:
    get:
      operationId: listSubscriptions
      tags:
        - subscriptions
      summary: List current user's active subscriptions
      responses:
        "200":
          description: Subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags:
        - subscriptions
      summary: Subscribe to a creator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionBody"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "402":
          description: Payment required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /subscriptions/price:
    put:
      operationId: updateSubscriptionPrice
      tags:
        - subscriptions
      summary: Set or update creator subscription price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionPriceBody"
      responses:
        "200":
          description: Updated price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPrice"
  /subscriptions/price/{creatorId}:
    get:
      operationId: getCreatorSubscriptionPrice
      tags:
        - subscriptions
      summary: Get creator's subscription price
      parameters:
        - name: creatorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subscription price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPrice"
        "404":
          description: No price set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /streak:
    get:
      operationId: getStreak
      tags:
        - streak
      summary: Get current user's streak and points
      responses:
        "200":
          description: Streak info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakInfo"
  /rewards/x:
    get:
      operationId: getXRewards
      tags:
        - streak
      summary: Server-side X reward status (UTC days)
      responses:
        "200":
          description: Current account claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XRewardsStatus"
  /rewards/x/{task}:
    post:
      operationId: claimXReward
      tags:
        - streak
      summary: Self-report an X action; no X verification
      parameters:
        - in: path
          name: task
          required: true
          schema:
            type: string
            enum:
              - follow
              - like
              - comment
              - notifications
              - post_x
      responses:
        "200":
          description: Atomic claim result; claimed false means already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XClaimResult"
  /streak/checkin:
    post:
      operationId: dailyCheckin
      tags:
        - streak
      summary: Daily login checkin for streak and points
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeetGameClaimInput"
      responses:
        "200":
          description: Updated streak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakInfo"
  /badges:
    get:
      operationId: listBadges
      tags:
        - badges
      summary: List current user's loyalty badges
      responses:
        "200":
          description: Badges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"
  /wallet/balance:
    get:
      operationId: getWalletBalance
      tags:
        - wallet
      summary: Get user wallet balances
      responses:
        "200":
          description: Wallet balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalance"
  /feed/summary:
    get:
      operationId: getFeedSummary
      tags:
        - feed
      summary: Get feed summary stats
      responses:
        "200":
          description: Feed summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedSummary"
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - feed
      summary: Get top users by streak points
      parameters:
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
  /posts/{postId}/comments:
    get:
      operationId: listComments
      tags:
        - posts
      summary: List comments on a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags:
        - posts
      summary: Add a comment to a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentBody"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
  /comments/{commentId}:
    delete:
      operationId: deleteComment
      tags:
        - posts
      summary: Delete a comment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /users/search:
    get:
      operationId: searchUsers
      tags:
        - users
      summary: Search users by username or name
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserWithStats"
  /users/{userId}/analytics:
    get:
      operationId: getCreatorAnalytics
      tags:
        - users
      summary: Get creator analytics for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Creator analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorAnalytics"
  /creator/program:
    get:
      operationId: creatorGetProgram
      responses:
        "200":
          description: Draft program configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorProgram"
  /creator/treasury:
    get:
      operationId: creatorGetTreasury
      responses:
        "200":
          description: Live read only treasury balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorTreasury"
  /creator/account:
    get:
      operationId: creatorGetAccount
      responses:
        "200":
          description: Current isolated preview or wallet session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorAccount"
    patch:
      operationId: creatorUpdateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorAccountInput"
      responses:
        "200":
          description: Updated profile with unverified socials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorAccount"
  /creator/session/demo:
    post:
      operationId: creatorEnterDemo
      responses:
        "200":
          description: Isolated sample workspace, no live privileges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorAccount"
  /creator/session/logout:
    post:
      operationId: creatorLogoutCreator
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorActionResult"
  /creator/session/applicant:
    post:
      operationId: creatorStartPreviewApplication
      responses:
        "200":
          description: Fresh isolated applicant preview, no main app identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorAccount"
  /creator/auth/challenge:
    post:
      operationId: creatorCreateWalletChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorWalletInput"
      responses:
        "200":
          description: Expiring single use login challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorWalletChallenge"
  /creator/auth/verify:
    post:
      operationId: creatorVerifyWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorSignatureInput"
      responses:
        "200":
          description: Wallet ownership verified, main account linking still required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorAccount"
  /creator/dashboard:
    get:
      operationId: creatorGetDashboard
      responses:
        "200":
          description: Weekly summary and recent contribution activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorDashboard"
  /creator/tasks:
    get:
      operationId: creatorGetTasks
      responses:
        "200":
          description: Configurable activity rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreatorTask"
  /creator/submissions:
    get:
      operationId: creatorGetSubmissions
      responses:
        "200":
          description: Private participant evidence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreatorSubmission"
    post:
      operationId: creatorCreateSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorSubmissionInput"
      responses:
        "201":
          description: Submitted for review, no score yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorSubmission"
  /creator/submissions/{id}:
    patch:
      operationId: creatorUpdateSubmission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorSubmissionUpdate"
      responses:
        "200":
          description: Withdrawn, appealed, or evidence updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorSubmission"
  /creator/application:
    post:
      operationId: creatorApplyToProgram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorApplicationInput"
      responses:
        "200":
          description: Application awaiting review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorAccount"
  /creator/leaderboard:
    get:
      operationId: creatorGetLeaderboard
      responses:
        "200":
          description: Approved weekly scores, demo scope explicitly identified
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreatorLeaderboardEntry"
  /creator/rewards:
    get:
      operationId: creatorGetRewards
      responses:
        "200":
          description: Immutable finalized allocations, not payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreatorReward"
  /creator/group:
    post:
      operationId: creatorRequestGroupAccess
      responses:
        "200":
          description: Eligibility request, no public invite exposed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorActionResult"
  /creator/admin:
    get:
      operationId: creatorGetAdminOverview
      responses:
        "200":
          description: Isolated preview review studio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorAdminOverview"
  /creator/admin/submissions/{id}/review:
    post:
      operationId: creatorReviewSubmission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorReviewInput"
      responses:
        "200":
          description: Auditable review with server calculated score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorSubmission"
  /creator/admin/applications/{id}/review:
    post:
      operationId: creatorReviewApplication
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorApplicationReview"
      responses:
        "200":
          description: Membership decision, demo badge only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorActionResult"
  /creator/admin/tasks/{id}:
    patch:
      operationId: creatorUpdateTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorTaskInput"
      responses:
        "200":
          description: New scoring version for future submissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorTask"
  /creator/admin/finalize:
    post:
      operationId: creatorFinalizeWeek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorAllocationInput"
      responses:
        "200":
          description: Finalized sample pool, never sends MON
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreatorReward"
  /creator/admin/points:
    post:
      operationId: creatorAllocateFinalPoints
      responses:
        "200":
          description: Sample points allocations, no main app credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorActionResult"
