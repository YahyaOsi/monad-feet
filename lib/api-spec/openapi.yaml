            AUTH_REQUIRED, WALLET_MISMATCH, INVALID_REGISTRATION,
            UNVERIFIED_ACCOUNT, REGISTRATION_UNAVAILABLE, RATE_LIMITED, or
            SAME_ORIGIN_REQUIRED
